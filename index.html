<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restro — Ledger</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#1c1b19;
  --ink-soft:#4a4640;
  --paper:#fbf7f0;
  --paper-line:#e8e0d0;
  --card:#ffffff;
  --turmeric:#c98a17;
  --turmeric-deep:#a3700f;
  --tomato:#b23a2e;
  --tomato-bg:#fbe4e1;
  --amber:#c98a17;
  --amber-bg:#faedd3;
  --sage:#5f7d54;
  --sage-bg:#e3ebdd;
  --focus:#2e6fd6;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 10% 0%, #fdf9f2 0%, var(--paper) 45%), var(--paper);
  color:var(--ink);}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0 0 4px 0;}
.app{display:flex;min-height:100vh;}

/* ---- Sidebar ---- */
.sidebar{width:220px;background:linear-gradient(180deg,#221f1a 0%,var(--ink) 55%,#151412 100%);
  color:#efe7d8;flex-shrink:0;padding:22px 0;display:flex;flex-direction:column;
  box-shadow:2px 0 14px rgba(0,0,0,.18);position:relative;z-index:20;}
.brand{padding:0 20px 20px 20px;border-bottom:1px solid #35322c;margin-bottom:10px;}
.brand h1{font-size:19px;color:#fff;display:flex;align-items:center;gap:8px;}
.brand-icon{font-size:20px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
.brand span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#b7ac93;}
.nav-item{padding:12px 20px;cursor:pointer;font-size:14px;border-left:3px solid transparent;display:flex;align-items:center;gap:10px;transition:background .15s ease, padding-left .15s ease;}
.nav-item:hover{background:#2a2822;padding-left:23px;}
.nav-item.active{background:linear-gradient(90deg,#2f2b23,#26231d);border-left-color:var(--turmeric);color:#fff;font-weight:600;}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:#6b6558;display:none;}
.sidebar-footer{margin-top:auto;padding:16px 20px 0 20px;border-top:1px solid #35322c;}
.sidebar-footer button{width:100%;margin-bottom:8px;font-size:12px;padding:9px 8px;background:#2a2822;color:#efe7d8;border:1px solid #423f37;border-radius:6px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:background .15s ease,transform .1s ease;}
.sidebar-footer button i{width:14px;text-align:center;flex-shrink:0;}
.sidebar-footer button:hover{background:#35322c;transform:translateX(2px);}

/* ---- Main ---- */
.main{flex:1;padding:28px 34px;overflow-x:auto;}
.page-title{margin-bottom:4px;}
.page-sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px;}

/* ---- Cards ---- */
.cards-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
.card{background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:14px 18px;min-width:150px;flex:1;
  box-shadow:0 1px 3px rgba(28,27,25,.05);transition:transform .12s ease, box-shadow .12s ease;}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(28,27,25,.09);}
.card .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px;}
.card .value{font-family:Georgia,serif;font-size:26px;font-weight:700;color:var(--ink);}
.card.accent .value{color:var(--turmeric-deep);}
.card.profit .value{color:var(--sage);}
.card.profit.neg .value{color:var(--tomato);}
.cards-row.mini{gap:10px;margin-bottom:8px;}
.cards-row.mini .card{padding:8px 12px;min-width:110px;}
.cards-row.mini .card .label{font-size:9.5px;margin-bottom:3px;}
.cards-row.mini .card .value{font-size:16px;}

/* ---- Section ---- */
.section{background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:18px 20px;margin-bottom:20px;
  box-shadow:0 1px 4px rgba(28,27,25,.05);}
.section h3{font-size:15px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--paper-line);display:flex;align-items:center;gap:8px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:820px){.two-col{grid-template-columns:1fr;}}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media(max-width:1080px){.three-col{grid-template-columns:1fr 1fr;}}
@media(max-width:820px){.three-col{grid-template-columns:1fr;}}
.sub-h{font-size:13px;margin-bottom:10px;font-weight:600;}
.sub-h-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sub-h-row .sub-h{margin-bottom:0;}
.inline-note{font-size:10.5px;color:var(--ink-soft);font-weight:400;white-space:nowrap;}
.count-pill{font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--paper-line);border-radius:20px;padding:1px 10px;}
.scroll-box{max-height:210px;overflow-y:auto;border:1px solid var(--paper-line);border-radius:6px;}
.scroll-box.bars{padding:10px 12px 4px 12px;}

/* ---- Bar chart (css based) ---- */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
.bar-label{width:150px;flex-shrink:0;color:var(--ink-soft);}
.bar-track{flex:1;background:var(--paper);border-radius:4px;overflow:hidden;height:16px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06);}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--turmeric),var(--turmeric-deep));border-radius:4px;transition:width .3s ease;}
.bar-fill.tomato{background:linear-gradient(90deg,#c9483a,var(--tomato));}
.bar-value{width:90px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0;}

/* ---- Table ---- */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:linear-gradient(180deg,#28251f,var(--ink));color:#efe7d8;text-align:left;padding:9px 10px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;position:sticky;top:0;z-index:1;}
td{padding:7px 10px;border-bottom:1px solid var(--paper-line);white-space:nowrap;}
tbody tr:nth-child(even) td{background:#faf7f0;}
tr:hover td{background:#f5ecd9 !important;}
.status-pill{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
.status-LOW{background:var(--tomato-bg);color:var(--tomato);}
.status-MEDIUM{background:var(--amber-bg);color:var(--amber);}
.status-FULL{background:var(--sage-bg);color:var(--sage);}
.actions button{border:none;background:none;cursor:pointer;font-size:13px;padding:2px 6px;}
.actions .edit{color:var(--focus);}
.actions .del{color:var(--tomato);}
.table-wrap{overflow-x:auto;}

/* ---- Form ---- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px;}
.field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select{width:100%;padding:7px 8px;border:1px solid var(--paper-line);border-radius:5px;font-size:13px;background:#fff;}
.field input:focus,.field select:focus{outline:2px solid var(--focus);outline-offset:1px;}
.form-actions{display:flex;gap:8px;}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--turmeric-deep);
  background:linear-gradient(180deg,var(--turmeric),var(--turmeric-deep));color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;box-shadow:0 1px 3px rgba(163,112,15,.35);transition:transform .1s ease, box-shadow .1s ease;}
.btn:hover{background:linear-gradient(180deg,var(--turmeric-deep),#8a5e0d);transform:translateY(-1px);box-shadow:0 4px 8px rgba(163,112,15,.35);}
.btn:active{transform:translateY(0);}
.btn.secondary{background:#fff;color:var(--ink-soft);border-color:var(--paper-line);box-shadow:0 1px 2px rgba(0,0,0,.04);}
.btn.secondary:hover{background:var(--paper);transform:translateY(-1px);}
.btn.danger{background:linear-gradient(180deg,#c9483a,var(--tomato));border-color:#8f2d23;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---- Categories lists ---- */
.cat-columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
.cat-list h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:8px;}
.cat-list ul{list-style:none;margin:0 0 10px 0;padding:0;}
.cat-list li{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid var(--paper-line);font-size:13px;}
.cat-list li button{border:none;background:none;color:var(--tomato);cursor:pointer;font-size:12px;}
.cat-add{display:flex;gap:6px;}
.cat-add input{flex:1;padding:6px 8px;border:1px solid var(--paper-line);border-radius:5px;font-size:12px;}
.cat-add button{padding:6px 10px;border-radius:5px;border:1px solid var(--turmeric-deep);background:var(--turmeric);color:#fff;cursor:pointer;font-size:12px;}

.period-row{display:flex;gap:14px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;}
.period-row .field{width:170px;}

/* ---- Dashboard header + compact period picker ---- */
.dash-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.dash-header .page-title, .dash-header .page-sub{margin-bottom:0;}
.period-compact{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--paper-line);border-radius:8px;padding:10px 12px;}
.period-compact .field{width:130px;margin-bottom:0;}
.period-compact .field label{font-size:10px;margin-bottom:3px;}
.period-compact input{padding:6px 7px;font-size:12px;}
.period-compact .btn{padding:7px 14px;font-size:12px;white-space:nowrap;}

/* ---- KPI cards (dashboard) ---- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:22px;}
.kpi-card{position:relative;background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:14px 16px 14px 18px;overflow:hidden;
  box-shadow:0 1px 3px rgba(28,27,25,.05);transition:transform .12s ease, box-shadow .12s ease;}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(28,27,25,.1);}
.kpi-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#c9c2b0;}
.kpi-card.delivery::before{background:var(--turmeric);}
.kpi-card.pickup::before{background:var(--sage);}
.kpi-card.catering::before{background:var(--tomato);}
.kpi-icon{font-size:16px;position:absolute;top:12px;right:14px;opacity:.5;}
.kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:7px;}
.kpi-value{font-family:Georgia,serif;font-size:23px;font-weight:700;color:var(--ink);}
.kpi-card.hero{background:linear-gradient(135deg,#26231d,var(--ink));}
.kpi-card.hero::before{background:var(--turmeric);}
.kpi-card.hero .kpi-label{color:#b7ac93;}
.kpi-card.hero .kpi-value{color:#fff;}
.kpi-card.profit .kpi-value{color:var(--sage);}
.kpi-card.profit::before{background:var(--sage);}
.kpi-card.profit.neg .kpi-value{color:var(--tomato);}
.kpi-card.profit.neg::before{background:var(--tomato);}
.empty-note{color:var(--ink-soft);font-size:13px;padding:14px 0;}
.hint{font-size:12px;color:var(--ink-soft);margin-top:8px;}
.controls-grid{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
.controls-grid .field{width:180px;}
.entries-header-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--paper-line);}
.entries-header-row h3{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.entries-header-row .inline-sort{width:170px;}
.entries-header-row .inline-sort label{font-size:10px;margin-bottom:3px;}
.entries-header-row .inline-sort select{padding:6px 7px;font-size:12px;}
.entries-header-row .inline-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.entries-header-row .inline-search{width:200px;}
.entries-header-row .inline-search label{font-size:10px;margin-bottom:3px;}
.entries-header-row .inline-search input{padding:6px 7px;font-size:12px;}
th.sortable-th{cursor:pointer;user-select:none;}
th.sortable-th:hover{background:#3a362d;}
th.sortable-th i{font-size:10px;margin-left:3px;opacity:.85;}
th.sortable-th.active-sort{color:#fff;}
.pagination-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:10px;}
.pagination-row .page-size-select{padding:6px 8px;border:1px solid var(--paper-line);border-radius:5px;font-size:12px;}
.pagination-row .btn{padding:6px 12px;font-size:12px;}

/* ---- Mobile top bar / hamburger ---- */
.mobile-topbar{display:none;}
.menu-backdrop{display:none;}
@media(max-width:820px){
  .app{display:block;}
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;
    background:var(--ink);color:#fff;padding:12px 16px;}
  .mobile-topbar .brand-mini{font-family:Georgia,serif;font-size:17px;}
  .mobile-topbar button{background:none;border:1px solid #55503f;color:#efe7d8;border-radius:6px;padding:6px 10px;font-size:18px;line-height:1;cursor:pointer;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s ease;width:250px;}
  .sidebar.open{transform:translateX(0);box-shadow:2px 0 18px rgba(0,0,0,.35);}
  .menu-backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;}
  .main{padding:16px;}
  .kpi-grid,.cards-row{gap:9px;}
  .kpi-card,.card{min-width:130px;padding:11px 13px;}
  .kpi-value{font-size:19px;}
  .form-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  .controls-grid .field, .period-row .field{width:100%;flex:1 1 130px;}
  table{font-size:12px;}
  th,td{padding:6px 7px;}
}

/* ---- Print view ---- */
@media print{
  .sidebar,.mobile-topbar,.menu-backdrop,.section form,.controls-grid,.pagination-row,
  .actions,th:last-child,td:last-child,#backupBanner,#toastHost,.shortcut-hint{display:none !important;}
  .app{display:block;}
  .main{padding:0;overflow:visible;}
  body{background:#fff;}
  .section{border:none;box-shadow:none;break-inside:avoid;}
  table{font-size:11px;}
}

/* ---- Backup reminder banner ---- */
.backup-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--amber-bg);border:1px solid var(--turmeric);color:var(--turmeric-deep);border-radius:8px;
  padding:10px 16px;margin-bottom:18px;font-size:13px;}
.backup-banner.stale{background:var(--tomato-bg);border-color:var(--tomato);color:var(--tomato);}
.backup-banner button{flex-shrink:0;}

/* ---- Inline backup widget (dashboard, before period dates) ---- */
.backup-mini{display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#f3ead7,#ecdfc2);
  border:1px solid var(--turmeric);color:var(--turmeric-deep);border-radius:7px;padding:8px 10px;
  font-size:11.5px;white-space:nowrap;height:32px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
.backup-mini.stale{background:linear-gradient(180deg,#fbe0dc,#f6cac4);border-color:var(--tomato);color:var(--tomato);}
.backup-mini-icon{font-size:13px;line-height:1;}
.backup-mini button{background:var(--ink);color:#f5d98a;border:none;border-radius:5px;padding:5px 10px;
  font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0;transition:transform .1s ease, background .15s ease;}
.backup-mini button:hover{background:#000;transform:translateY(-1px);}

/* ---- Undo toast ---- */
#toastHost{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--ink);color:#efe7d8;padding:10px 14px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:toastIn .15s ease;}
.toast button{background:none;border:1px solid #55503f;color:#f5d98a;border-radius:5px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:600;}
.toast button:hover{background:#2a2822;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---- Validation ---- */
.field.invalid input,.field.invalid select{outline:2px solid var(--tomato);outline-offset:1px;}
.field .field-err{color:var(--tomato);font-size:11px;margin-top:3px;display:none;}
.field.invalid .field-err{display:block;}
.form-error-banner{background:var(--tomato-bg);color:var(--tomato);border:1px solid var(--tomato);border-radius:6px;padding:8px 12px;font-size:12.5px;margin-bottom:12px;display:none;}
.form-error-banner.show{display:block;}

/* ---- Keyboard shortcut hint ---- */
.shortcut-hint{font-size:11.5px;color:var(--ink-soft);margin:-8px 0 16px 0;}
.shortcut-hint kbd{background:#fff;border:1px solid var(--paper-line);border-radius:4px;padding:1px 6px;font-family:inherit;font-size:11px;box-shadow:0 1px 0 var(--paper-line);}

/* ---- Comparison badges ---- */
.cmp-badge{font-size:11.5px;font-weight:700;margin-left:6px;padding:1px 7px;border-radius:20px;display:inline-block;vertical-align:middle;}
.cmp-badge.up{background:var(--sage-bg);color:var(--sage);}
.cmp-badge.down{background:var(--tomato-bg);color:var(--tomato);}
.cmp-badge.flat{background:#eee;color:var(--ink-soft);}
.kpi-card .kpi-sub{font-size:10.5px;color:var(--ink-soft);margin-top:4px;}

/* ---- Empty state (first run) ---- */
.getting-started{background:linear-gradient(160deg,#fff,var(--amber-bg));border:1px dashed var(--turmeric);border-radius:12px;padding:30px;text-align:center;margin-bottom:20px;box-shadow:0 2px 8px rgba(163,112,15,.08);}
.getting-started h3{border:none;margin-bottom:6px;padding-bottom:0;}
.getting-started .btn{margin:4px;}
/* ---- Login screen ---- */
.login-screen{position:fixed;inset:0;background:var(--paper-bg,#f7f3ea);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
.login-card{background:#fff;border:1px solid var(--paper-line);border-radius:14px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center;}
.login-card h1{font-size:20px;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}
.login-card form{text-align:left;}
.login-card .field{margin-bottom:14px;}
.login-card .field label{display:block;font-size:12px;margin-bottom:4px;color:var(--ink-soft);}
.login-card .field input{width:100%;padding:9px 10px;border:1px solid var(--paper-line);border-radius:7px;font-size:14px;}
.login-error{background:#fdecea;color:#a3260f;border:1px solid #f3c3ba;border-radius:7px;padding:8px 10px;font-size:12.5px;margin-bottom:14px;}
.login-loading{margin-top:16px;font-size:13px;color:var(--ink-soft);}
.sync-status{font-size:10.5px;color:var(--ink-soft);text-align:center;margin-top:6px;min-height:14px;}
</style>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1><span class="brand-icon"><i class="fa-solid fa-utensils"></i></span> Restro</h1>
    <p class="login-sub">Sign in to your account</p>
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" required autocomplete="current-password"></div>
      <div id="loginError" class="login-error" style="display:none;"></div>
      <button type="submit" class="btn" id="loginSubmitBtn" style="width:100%;">Sign in</button>
    </form>
    <div id="loginLoading" class="login-loading" style="display:none;">Loading your data…</div>
  </div>
</div>
<div class="mobile-topbar">
  <span class="brand-mini"><i class="fa-solid fa-utensils"></i> <span id="brandTitleMobile">Restro</span></span>
  <button id="btnMobileMenu" aria-label="Open menu">&#9776;</button>
</div>
<div class="menu-backdrop" id="menuBackdrop"></div>
<div class="app" id="appShell" style="display:none;">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <h1><span class="brand-icon"><i class="fa-solid fa-utensils"></i></span> <span id="brandTitle">Restro</span></h1>
      <span id="brandSub">Private ledger</span>
    </div>
    <div id="nav"></div>
    <div class="sidebar-footer">
      <button id="btnBackToRestaurants" style="display:none;"><i class="fa-solid fa-arrow-left"></i> Back to restaurants</button>
      <button id="btnPrint"><i class="fa-solid fa-print"></i> Print / save PDF</button>
      <button id="btnDownloadExcel"><i class="fa-solid fa-chart-line"></i> Download report (.xls)</button>
      <button id="btnExport"><i class="fa-solid fa-download"></i> Export backup (.json)</button>
      <button id="btnImport"><i class="fa-solid fa-upload"></i> Import backup (.json)</button>
      <input type="file" id="fileImport" accept=".json" style="display:none;">

async function pushStateToCloud(){
  if(!currentUser || !currentRestaurantId) return;
  if(cloudSaveInFlight){ pendingCloudSave = true; return; }
  cloudSaveInFlight = true;
  setSyncStatus('Saving…');
  try{
    const { error } = await supabaseClient
      .from('app_state')
      .upsert({ restaurant_id: currentRestaurantId, data: state, updated_at: new Date().toISOString() }, { onConflict: 'restaurant_id' });

  }catch(e){
    setSyncStatus('Save failed — check connection');
    console.error(e);
  }
  cloudSaveInFlight = false;
  if(pendingCloudSave){ pendingCloudSave = false; pushStateToCloud(); }
}

function queueCloudSave(){
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(pushStateToCloud, 700);
}

    .from('app_state')

    .eq('restaurant_id', currentRestaurantId)
    .maybeSingle();
  if(error){ console.error(error); return null; }
  return data ? data.data : null;
}

async function ensureCloudRowExists(initialState){

}

async function fetchIsOrganizer(userId){
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('is_organizer')
    .eq('user_id', userId)
    .maybeSingle();
  if(error){ console.error(error); return false; }
  return !!(data && data.is_organizer);
}

async function fetchAllRestaurants(){
  const { data, error } = await supabaseClient
    .from('restaurants')
    .select('id, name, created_at')
    .order('name', { ascending: true });
  if(error){ console.error(error); return []; }
  return data || [];
}

async function fetchMyRestaurantMemberships(userId){
  const { data, error } = await supabaseClient
    .from('restaurant_members')
    .select('restaurant_id, restaurants(id, name)')
    .eq('user_id', userId);
  if(error){ console.error(error); return []; }
  return (data || [])
    .filter(row => row.restaurants)
    .map(row => ({ id: row.restaurants.id, name: row.restaurants.name }));
}

async function createRestaurant(name){
  const { data, error } = await supabaseClient
    .from('restaurants')
    .insert({ name })
    .select()
    .single();
  if(error) throw error;
  return data;
}

async function linkOwnerToRestaurant(restaurantId, email){
  const { error } = await supabaseClient.rpc('link_owner_to_restaurant', {
    p_restaurant_id: restaurantId,
    p_email: email
  });
  if(error) throw error;
}

let state = defaultState();
function load(){
  let saved = null;
  try{
    const raw = localStorage.getItem(storageKey());
    if(raw) saved = JSON.parse(raw);
  }catch(e){}
  const def = defaultState();
  if(!saved) return def;
  return migrateState(saved, def);
}

/* Repairs older saved data that predates newer fields/sheets
   (Menu Items, Complimentary, Inventory, Discounts, Delivery Fee, etc.)
   so the app never crashes on missing keys — it just fills in sane defaults
   while keeping every bit of your existing data intact. */
function migrateState(saved, def){
  const merged = Object.assign({}, def, saved);

  // Any top-level array that's missing or not actually an array falls back to defaults
  ['menuItems','dailySales','expenses','inventory','complimentary'].forEach(key=>{
    if(!Array.isArray(merged[key])) merged[key] = def[key];
  });

  // Nested objects: keep old values, fill in any newly-added keys
  merged.categories = Object.assign({}, def.categories, saved.categories||{});
  merged.dashboard = Object.assign({}, def.dashboard, saved.dashboard||{});

  // Per-row repair: each row keeps its existing values, missing fields get defaults.
  // One-time migration: earlier versions stored the customer's name inside "notes"
  // (the field was labelled "Customer / notes"). If a row predates the separate
  // Customer Name field, move that text over so existing customer history isn't lost.
  merged.dailySales = merged.dailySales.map(r => {
    if(r.customerName===undefined && r.notes){
      r = Object.assign({}, r, { customerName: r.notes, notes: '' });
    }
    return Object.assign({
      id: uid(), date:'', orderId:'', item:'', qty:1, price:0, deliveryFee:0,
      discountType:'Amount', discountValue:0,
      orderType:'', compYN:'No', compItem:'', reason:'', payment:'', tip:0, customerName:'', notes:''
    }, r);
  });

  merged.menuItems = merged.menuItems.map(r => Object.assign(
    {id:uid(), name:'', price:0, active:'Y', notes:'', quantity:1, unit:'Pcs', unitValue:0, cost:0}, r));

  merged.complimentary = merged.complimentary.map(r => Object.assign(
    {id:uid(), name:'', price:0, cost:0, active:'Y', notes:''}, r));

  merged.inventory = merged.inventory.map(r => Object.assign(
    {id:uid(), name:'', category:'', unit:'', currentStock:0, reorderLevel:0,
     fullStock:0, lastPurchaseDate:'', lastPurchaseCost:0, notes:''}, r));

  merged.expenses = merged.expenses.map(r => Object.assign(
    {id:uid(), date:'', category:'', description:'', vendor:'', payment:'', amount:0, isDamage:false, notes:''}, r));

  // Persist the repaired shape right away so future loads skip migration
  try{ localStorage.setItem(storageKey(), JSON.stringify(merged)); }catch(e){}

  return merged;
}

  try{ localStorage.setItem(storageKey(), JSON.stringify(state)); }catch(e){}

}

function dayAbbrev(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '';
  return ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
}
function fmtMoney(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function inRange(dateStr, start, end){
  if(!dateStr) return false;
  return (!start || dateStr >= start) && (!end || dateStr <= end);
}
function findComp(name){
  return state.complimentary.find(c => c.name === name);
}
function itemTotal(row){
  return (Number(row.qty)||0) * (Number(row.price)||0);
}
function discountAmount(row){
  const val = Number(row.discountValue)||0;
  if(val<=0) return 0;
  if(row.discountType==='Percent') return itemTotal(row) * val/100;
  return val;
}
function netItemTotal(row){
  return Math.max(0, itemTotal(row) - discountAmount(row));
}
function rowRevenue(row){
  return netItemTotal(row) + (Number(row.deliveryFee)||0);
}
function compCost(row){
  if(row.compYN !== 'Yes') return 0;
  const c = findComp(row.compItem);
  return c ? Number(c.cost)||0 : 0;
}
function invStatus(inv){
  const cur = Number(inv.currentStock), full = Number(inv.fullStock), reorder = Number(inv.reorderLevel);
  if(!full) return {label:'', pct:0};
  const pct = cur/full;
  let label;
  if(cur <= reorder) label = 'LOW';
  else if(pct >= 1) label = 'FULL';
  else label = 'MEDIUM';
  return {label, pct};
}
function getWeekStart(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = (day===0 ? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

   TABLE FILTER + SORT + PERIOD + PAGINATION FRAMEWORK
   ========================================================= */
const tableState = {
  sales: {page:1, pageSize:10, filter:'', sortField:'date', sortDir:'desc', periodFilter:'all', specificDate:''},
  expenses: {page:1, pageSize:10, filter:'', sortField:'date', sortDir:'desc', periodFilter:'all', specificDate:''},
  inventory: {page:1, pageSize:10, filter:'', sortDir:'asc', periodFilter:'all', specificDate:''},
  complimentary: {page:1, pageSize:10, filter:'', sortDir:'asc'},
  menu: {page:1, pageSize:10, filter:'', sortDir:'asc'},
};
function filterRows(rows, filterText, fields){
  if(!filterText) return rows;
  const q = filterText.toLowerCase();
  return rows.filter(r => fields.some(f => String(r[f]||'').toLowerCase().includes(q)));
}
function sortByField(rows, field, dir){
  return rows.slice().sort((a,b)=>{
    const av = (a[field]||'').toString();
    const bv = (b[field]||'').toString();
    if(av<bv) return dir==='asc' ? -1 : 1;
    if(av>bv) return dir==='asc' ? 1 : -1;
    return 0;
  });
}
function inPeriodFilter(dateStr, periodFilter, specificDate){
  if(!periodFilter || periodFilter==='all') return true;
  if(!dateStr) return false;
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date();
  if(periodFilter==='week'){
    const ws = new Date(getWeekStart(now.toISOString().slice(0,10))+'T00:00:00');
    const we = new Date(ws); we.setDate(we.getDate()+6);
    return d>=ws && d<=we;
  }
  if(periodFilter==='month'){
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }
  if(periodFilter==='year'){
    return d.getFullYear()===now.getFullYear();
  }
  if(periodFilter==='specific'){
    return dateStr === specificDate;
  }
  return true;
}
function applyPeriodFilter(rows, dateField, periodFilter, specificDate){
  if(!periodFilter || periodFilter==='all') return rows;
  return rows.filter(r=> inPeriodFilter(r[dateField], periodFilter, specificDate));
}
function paginateRows(rows, key){
  const st = tableState[key];
  const total = rows.length;
  const totalPages = Math.max(1, Math.ceil(total/st.pageSize));
  if(st.page>totalPages) st.page = totalPages;
  if(st.page<1) st.page = 1;
  const startIdx = (st.page-1)*st.pageSize;
  return { pageRows: rows.slice(startIdx,startIdx+st.pageSize), totalPages, total, page: st.page };
}

/* =========================================================

   ========================================================= */
function showUndoToast(message, onUndo){
  const host = document.getElementById('toastHost');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span>${message}</span><button>Undo</button>`;
  let done = false;
  const finish = ()=>{ if(done) return; done = true; toast.remove(); };
  toast.querySelector('button').onclick = ()=>{ finish(); onUndo(); };
  host.appendChild(toast);
  setTimeout(finish, 6000);
}

/* =========================================================
   FORM VALIDATION
   ========================================================= */
function validateFields(form, rules){
  // rules: [{name, label, test(value)=>bool, message}]
  let firstInvalid = null;
  let errors = [];
  rules.forEach(rule=>{
    const el = form.querySelector(`[name="${rule.name}"]`);
    if(!el) return;
    const fieldWrap = el.closest('.field');
    const ok = rule.test(el.value);
    if(fieldWrap){
      let err = fieldWrap.querySelector('.field-err');
      if(!err){
        err = document.createElement('div');
        err.className = 'field-err';
        fieldWrap.appendChild(err);
      }
      if(!ok){
        fieldWrap.classList.add('invalid');
        err.textContent = rule.message;
        errors.push(rule.message);
        if(!firstInvalid) firstInvalid = el;
      } else {
        fieldWrap.classList.remove('invalid');
      }
    }
  });
  if(firstInvalid) firstInvalid.focus();
  return errors;
}
function showFormError(form, errors){
  let banner = form.querySelector('.form-error-banner');
  if(!banner){
    banner = document.createElement('div');
    banner.className = 'form-error-banner';
    form.insertBefore(banner, form.firstChild);
  }
  if(errors.length){
    banner.innerHTML = 'Please fix: ' + errors.join(' · ');
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function computeDashboardStats(){
  const {start,end} = state.dashboard;

  const salesInRange = state.dailySales.filter(r=>inRange(r.date,start,end));
  const expInRange = state.expenses.filter(r=>inRange(r.date,start,end));

  const revByChannel = {};
  state.categories.orderType.forEach(ot=>{ revByChannel[ot] = 0; });
  salesInRange.forEach(r=>{
    if(r.orderType in revByChannel) revByChannel[r.orderType] += rowRevenue(r);
  });
  const totalRev = Object.values(revByChannel).reduce((s,v)=>s+v,0);
  const deliveryFeeRev = salesInRange.reduce((s,r)=>s+(Number(r.deliveryFee)||0),0);
  const itemRev = totalRev - deliveryFeeRev;
  const orderIds = new Set(salesInRange.map(r=>r.orderId).filter(Boolean));

  const revByPayment = {};
  state.categories.paymentMethod.forEach(pm=>{ revByPayment[pm] = 0; });
  salesInRange.forEach(r=>{
    const pm = r.payment || 'Unspecified';
    revByPayment[pm] = (revByPayment[pm]||0) + rowRevenue(r);
  });
  const totalTips = salesInRange.reduce((s,r)=>s+(Number(r.tip)||0),0);

  const totalExp = expInRange.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const expByCat = {};
  state.categories.category.forEach(c=>expByCat[c]=0);
  expInRange.forEach(r=>{ expByCat[r.category] = (expByCat[r.category]||0) + (Number(r.amount)||0); });

  const damageRows = expInRange.filter(r=>r.isDamage);
  const damagesTotal = damageRows.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const damagesCount = damageRows.length;
  const damagesPctOfExp = totalExp ? (damagesTotal/totalExp) : 0;

  const compRows = salesInRange.filter(r=>r.compYN==='Yes');
  const compCount = compRows.length;
  const compCostTotal = compRows.reduce((s,r)=>s+compCost(r),0);
  const compPct = totalRev ? (compCostTotal/totalRev) : 0;

  const compByItemAll = {};
  state.complimentary.forEach(c=>compByItemAll[c.name]=0);
  compRows.forEach(r=>{ compByItemAll[r.compItem] = (compByItemAll[r.compItem]||0) + 1; });
  const compByItem = Object.fromEntries(
    Object.entries(compByItemAll).sort((a,b)=>b[1]-a[1]).slice(0,4)
  );

  const compByReason = {};
  state.categories.reason.forEach(rs=>compByReason[rs]=0);
  compRows.forEach(r=>{ compByReason[r.reason] = (compByReason[r.reason]||0) + compCost(r); });

  const discRows = salesInRange.filter(r=>discountAmount(r)>0);
  const discCount = discRows.length;
  const discTotal = discRows.reduce((s,r)=>s+discountAmount(r),0);
  const grossItemRev = salesInRange.reduce((s,r)=>s+itemTotal(r),0);
  const discPct = grossItemRev ? (discTotal/grossItemRev) : 0;

  const lowStockItems = state.inventory.filter(i=>invStatus(i).label==='LOW');
  const totalCost = salesInRange.reduce((s,r)=>{
    const menuItem = state.menuItems.find(m=>m.name===r.item);
    const unitCost = menuItem ? (Number(menuItem.cost)||0) : 0;
    return s + unitCost * (Number(r.qty)||0);
  }, 0);
  const hasCostData = state.menuItems.some(m=>Number(m.cost)>0);
  // Gross Profit: revenue minus ingredient/COGS cost only (standard term: Revenue − COGS)
  const grossProfit = totalRev - totalCost;
  // Total Profit: revenue minus operating expenses only — an interim figure, before backing out complimentary giveaways
  const totalProfit = totalRev - totalExp;
  // Net Profit: the true bottom line — revenue minus expenses minus complimentary cost (standard term: the final number after every deduction)
  const netProfit = totalRev - totalExp - compCostTotal;

  return { start,end, revByChannel, revByPayment, totalTips, totalRev, deliveryFeeRev, itemRev, orderIds, totalExp, expByCat,
    compCount, compCostTotal, compPct, compByItem, compByReason,
    discCount, discTotal, discPct,
    damagesTotal, damagesCount, damagesPctOfExp,
    lowStockItems, totalCost, hasCostData, grossProfit, netProfit, totalProfit };
}

function trendBucketKey(dateStr, granularity){
  if(granularity==='daily') return dateStr;
  if(granularity==='weekly') return getWeekStart(dateStr);
  if(granularity==='monthly') return dateStr.slice(0,7);
  return dateStr.slice(0,4);
}
function computeSalesTrend(granularity){
  const now = new Date();
  const buckets = {};
  state.dailySales.forEach(r=>{
    if(!r.date) return;
    const key = trendBucketKey(r.date, granularity);
    buckets[key] = (buckets[key]||0) + rowRevenue(r);
  });
  const keys = [];
  if(granularity==='daily'){
    for(let i=2;i>=0;i--){
      const dd = new Date(now); dd.setDate(dd.getDate()-i);
      keys.push(dd.toISOString().slice(0,10));
    }
  } else if(granularity==='weekly'){
    const thisWeekStart = getWeekStart(now.toISOString().slice(0,10));
    const base = new Date(thisWeekStart+'T00:00:00');
    for(let i=2;i>=0;i--){
      const wd = new Date(base); wd.setDate(wd.getDate() - i*7);
      keys.push(wd.toISOString().slice(0,10));
    }
  } else if(granularity==='monthly'){
    for(let i=2;i>=0;i--){
      const md = new Date(now.getFullYear(), now.getMonth()-i, 1);
      keys.push(md.toISOString().slice(0,7));
    }
  } else {
    for(let i=2;i>=0;i--){
      keys.push(String(now.getFullYear()-i));
    }
  }
  const result = {};
  keys.forEach(k=>{
    let label = k;
    if(granularity==='daily') label = dayAbbrev(k) + ' ' + k.slice(5);
    if(granularity==='weekly') label = 'Wk of ' + k;
    result[label] = buckets[k] || 0;
  });
  return result;
}
function computeTopCustomers(limit){
  const {start,end} = state.dashboard;
  const salesInRange = state.dailySales.filter(r=>inRange(r.date,start,end));
  const byCustomer = {};
  salesInRange.forEach(r=>{
    const name = (r.customerName||'').trim();
    if(!name) return;
    if(!byCustomer[name]) byCustomer[name] = {orders:new Set(), qty:0, revenue:0};
    byCustomer[name].orders.add(r.orderId || r.id);
    byCustomer[name].qty += Number(r.qty)||0;
    byCustomer[name].revenue += rowRevenue(r);
  });
  const arr = Object.entries(byCustomer).map(([name,v])=>({name, orders:v.orders.size, qty:v.qty, revenue:v.revenue}));
  arr.sort((a,b)=> b.orders-a.orders || b.revenue-a.revenue);
  return arr.slice(0, limit);
}
function computeTopItems(limit){
  const {start,end} = state.dashboard;
  const salesInRange = state.dailySales.filter(r=>inRange(r.date,start,end));
  const byItem = {};
  salesInRange.forEach(r=>{
    if(!r.item) return;
    if(!byItem[r.item]) byItem[r.item] = {qty:0, revenue:0};
    byItem[r.item].qty += Number(r.qty)||0;
    byItem[r.item].revenue += itemTotal(r);
  });
  const arr = Object.entries(byItem).map(([item,v])=>({item, qty:v.qty, revenue:v.revenue}));
  arr.sort((a,b)=> b.revenue-a.revenue);
  return arr.slice(0, limit);
}

/* ---- Profit per item (uses optional menu-item ingredient Cost) ---- */
function computeProfitByItem(limit){
  const {start,end} = state.dashboard;
  const salesInRange = state.dailySales.filter(r=>inRange(r.date,start,end));
  const byItem = {};
  salesInRange.forEach(r=>{
    if(!r.item) return;
    if(!byItem[r.item]) byItem[r.item] = {qty:0, revenue:0, cost:0};
    const menuItem = state.menuItems.find(m=>m.name===r.item);
    const unitCost = menuItem ? (Number(menuItem.cost)||0) : 0;
    byItem[r.item].qty += Number(r.qty)||0;
    byItem[r.item].revenue += netItemTotal(r);
    byItem[r.item].cost += unitCost * (Number(r.qty)||0);
  });
  const arr = Object.entries(byItem).map(([item,v])=>({item, qty:v.qty, revenue:v.revenue, cost:v.cost, profit:v.revenue-v.cost}));
  arr.sort((a,b)=> b.profit-a.profit);
  const hasCostData = state.menuItems.some(m=>Number(m.cost)>0);
  return { rows: arr.slice(0, limit), hasCostData };
}

/* ---- Revenue by day of week, within the current dashboard period ---- */
function computeDayOfWeekTrend(){
  const {start,end} = state.dashboard;
  const order = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const totals = {}; order.forEach(d=>totals[d]=0);
  state.dailySales.filter(r=>inRange(r.date,start,end)).forEach(r=>{
    const d = dayAbbrev(r.date);
    if(d) totals[d] += rowRevenue(r);
  });
  return totals;
}

/* ---- Period-over-period comparison (previous period of equal length) ---- */
function computePreviousPeriodStats(){
  const {start,end} = state.dashboard;
  if(!start || !end) return null;
  const startD = new Date(start+'T00:00:00');
  const endD = new Date(end+'T00:00:00');
  const spanDays = Math.round((endD-startD)/86400000) + 1;
  if(spanDays<=0) return null;
  const prevEndD = new Date(startD); prevEndD.setDate(prevEndD.getDate()-1);
  const prevStartD = new Date(prevEndD); prevStartD.setDate(prevStartD.getDate()-(spanDays-1));
  const prevStart = prevStartD.toISOString().slice(0,10);
  const prevEnd = prevEndD.toISOString().slice(0,10);

  const salesInRange = state.dailySales.filter(r=>inRange(r.date,prevStart,prevEnd));
  const expInRange = state.expenses.filter(r=>inRange(r.date,prevStart,prevEnd));
  const totalRev = salesInRange.reduce((s,r)=>s+rowRevenue(r),0);
  const totalExp = expInRange.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const compCostTotal = salesInRange.filter(r=>r.compYN==='Yes').reduce((s,r)=>s+compCost(r),0);
  const netProfit = totalRev - totalExp - compCostTotal;
  return { prevStart, prevEnd, totalRev, totalExp, netProfit };
}
function pctChange(cur, prev){
  if(!prev) return null;
  return ((cur-prev)/Math.abs(prev))*100;
}
function cmpBadgeHtml(cur, prev, higherIsBetter){
  if(higherIsBetter===undefined) higherIsBetter = true;
  const pct = pctChange(cur, prev);
  if(pct===null) return '';
  const dir = pct>0.5 ? 'up' : (pct<-0.5 ? 'down' : 'flat');
  const good = dir==='flat' ? 'flat' : ((dir==='up')===higherIsBetter ? 'up' : 'down');
  const arrow = dir==='up' ? '▲' : (dir==='down' ? '▼' : '▬');
  return `<span class="cmp-badge ${good}">${arrow} ${Math.abs(pct).toFixed(0)}%</span>`;
}

function barChart(dataObj, isMoney){
  const entries = Object.entries(dataObj);
  const max = Math.max(1, ...entries.map(e=>e[1]));
  if(!entries.length || entries.every(e=>e[1]===0)) return '<div class="empty-note">No data in this period yet.</div>';
  return entries.map(([label,val])=>{
    const pct = Math.round((val/max)*100);
    const display = isMoney ? fmtMoney(val) : val.toLocaleString();
    return `<div class="bar-row">
      <div class="bar-label" title="${label}">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-value">${display}</div>
    </div>`;
  }).join('');
}
function plainTable(dataObj, isMoney, labelHeader, valueHeader){
  const entries = Object.entries(dataObj);
  if(!entries.length || entries.every(([,v])=>v===0)) return '<div class="empty-note">No data in this period yet.</div>';
  return `<table><thead><tr><th>${labelHeader}</th><th>${valueHeader}</th></tr></thead><tbody>
    ${entries.map(([k,v])=>`<tr><td>${k}</td><td>${isMoney?fmtMoney(v):v.toLocaleString()}</td></tr>`).join('')}
  </tbody></table>`;
}
function topCustomersTable(arr){
  if(!arr.length) return '<div class="empty-note">No customer data yet — add a Customer Name on Daily Sales.</div>';
  return `<table><thead><tr><th>Customer</th><th>Orders</th><th>Qty</th><th>Revenue</th></tr></thead><tbody>
    ${arr.map(c=>`<tr><td>${c.name}</td><td>${c.orders}</td><td>${c.qty}</td><td>${fmtMoney(c.revenue)}</td></tr>`).join('')}
  </tbody></table>`;
}
function topItemsTable(arr){
  if(!arr.length) return '<div class="empty-note">No sales data in this period yet.</div>';
  return `<table><thead><tr><th>Item</th><th>Qty</th><th>Revenue</th></tr></thead><tbody>
    ${arr.map(i=>`<tr><td>${i.item}</td><td>${i.qty}</td><td>${fmtMoney(i.revenue)}</td></tr>`).join('')}
  </tbody></table>`;
}
function profitByItemTable(arr){
  if(!arr.length) return '<div class="empty-note">No sales data in this period yet.</div>';
  return `<table><thead><tr><th>Item</th><th>Qty</th><th>Revenue</th><th>Cost</th><th>Profit</th><th>Margin %</th></tr></thead><tbody>
    ${arr.map(i=>{
      const margin = i.revenue ? (i.profit/i.revenue*100) : 0;
      return `<tr><td>${i.item}</td><td>${i.qty}</td><td>${fmtMoney(i.revenue)}</td><td>${fmtMoney(i.cost)}</td>
      <td style="color:${i.profit<0?'var(--tomato)':'var(--sage)'};font-weight:600;">${fmtMoney(i.profit)}</td>
      <td style="color:${margin<0?'var(--tomato)':'var(--sage)'};font-weight:600;">${margin.toFixed(1)}%</td></tr>`;
    }).join('')}
  </tbody></table>`;
}

function nextOrderId(){
  const nums = state.dailySales.map(r=>{

  const max = nums.length ? Math.max(...nums) : 1000;
  return 'ORD-' + (max+1);
}

function selectHtml(name, options, selected, includeBlank){
  let html = `<select name="${name}">`;
  if(includeBlank) html += `<option value="">—</option>`;
  options.forEach(o=>{
    html += `<option value="${o}" ${o===selected?'selected':''}>${o}</option>`;
  });
  html += `</select>`;
  return html;
}

/* =========================================================
   EXCEL REPORT EXPORT (self-contained — no external library,
   uses the Excel 2003 "SpreadsheetML" XML format that Excel
   opens natively, so nothing ever leaves the browser)
   ========================================================= */
function xmlEscape(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                   .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function xCell(value){
  if(value===null || value===undefined || value==='') return `<Cell><Data ss:Type="String"></Data></Cell>`;
  if(typeof value==='number' && !isNaN(value)) return `<Cell><Data ss:Type="Number">${value}</Data></Cell>`;
  return `<Cell><Data ss:Type="String">${xmlEscape(value)}</Data></Cell>`;
}
function xRow(cells, bold){
  const style = bold ? ' ss:StyleID="hdr"' : '';
  return `<Row${style}>${cells.map(xCell).join('')}</Row>`;
}
function xSheet(name, headerRow, dataRows){
  let xml = `<Worksheet ss:Name="${xmlEscape(name)}"><Table>`;
  xml += xRow(headerRow, true);
  dataRows.forEach(r => xml += xRow(r));
  xml += `</Table></Worksheet>`;
  return xml;
}

  const dashboardSheet = xSheet('Dashboard', ['Metric','Value'], dashRows);

  const salesHeaders = ['Date','Day','Order ID','Customer Name','Item','Qty','Unit Price','Item Total',
    'Disc. Type','Disc. Value','Disc. Amount','Delivery Fee','Net Total','Order Type','Payment Method','Tip',
    'Complimentary','Comp. Item','Comp. Cost','Comp. Reason','Notes'];

    r.compYN==='Yes'?(r.reason||''):'', r.notes||''
  ]);
  const salesSheet = xSheet('Daily Sales', salesHeaders, salesRows);

  const expHeaders = ['Date','Day','Category','Description','Vendor','Payment Method','Amount','Damage/Loss','Notes'];
  const expRows = state.expenses.slice().sort((a,b)=>a.date<b.date?-1:1).map(r=>[

  ]);

  const catSheet = xSheet('Categories', catHeaders, catRows);

  const xml = `<?xml version="1.0"?>

</Workbook>`;
  return xml;

/* =========================================================
   BACKUP / RESTORE
   ========================================================= */
function lastBackupKey(){ return storageKey() + '_lastBackup'; }
function getLastBackupDate(){
  try{ return localStorage.getItem(lastBackupKey()); }catch(e){ return null; }
}
function setLastBackupDate(iso){
  try{ localStorage.setItem(lastBackupKey(), iso); }catch(e){}
}
function daysSince(iso){
  if(!iso) return null;
  const then = new Date(iso+'T00:00:00');
  if(isNaN(then)) return null;
  const now = new Date();
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((nowMid-then)/86400000);
}
function renderBackupBanner(){
  const el = document.getElementById('backupBanner');
  if(!el) return;
  const last = getLastBackupDate();
  const days = daysSince(last);
  const stale = days===null || days>=7;
  let msg;
  if(!last) msg = 'No backup yet.';
  else if(days===0) msg = 'Backed up today.';
  else if(days===1) msg = 'Backup: yesterday.';
  else msg = `Backup: ${days}d ago.`;
  el.innerHTML = `<div class="backup-mini ${stale?'stale':''}">
    <span class="backup-mini-icon">${stale?'<i class="fa-solid fa-triangle-exclamation"></i>':'<i class="fa-solid fa-circle-check"></i>'}</span>
    <span class="backup-mini-text">${msg}</span>
    <button type="button" id="bannerBackupBtn"><i class="fa-solid fa-download"></i> Back up now</button>
  </div>`;
  document.getElementById('bannerBackupBtn').onclick = ()=> document.getElementById('btnExport').click();
}

  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('This will replace all current data with the backup file. Continue?')) return;
      state = data;
      save(); renderAll();
    }catch(err){
      alert('Could not read that file — make sure it is a backup exported from this app.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

/* Cancel-edit delegation (buttons are re-created on every render) */
document.getElementById('main').addEventListener('click', (e)=>{
  if(e.target && e.target.id==='cancelEdit'){ editingId = null; renderAll(); }
});

/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */
document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag==='input' || tag==='select' || tag==='textarea';
  if(e.key==='/' && !typing){
    const search = document.querySelector('#main .filter-input');
    if(search){ e.preventDefault(); search.focus(); }
  } else if((e.key==='n' || e.key==='N') && !typing){
    const form = document.querySelector('#main form');
    if(form){
      e.preventDefault();
      const firstField = form.querySelector('input,select');
      if(firstField) firstField.focus();
      form.scrollIntoView({behavior:'smooth', block:'start'});
    }
  } else if(e.key==='Escape' && typing){
    if(editingId){ editingId = null; renderAll(); }
  }
});

/* =========================================================
   AUTH + INIT
   ========================================================= */
function showLoginScreen(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
}
function showAppShell(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = '';
}

async function openRestaurant(restaurantId, restaurantName){
  currentRestaurantId = restaurantId;
  currentRestaurantName = restaurantName || '';
  viewMode = 'ledger';
  activeTab = 'dashboard';
  document.getElementById('loginLoading').style.display = 'block';
  try{
    let cloudData = await fetchStateFromCloud();
    if(!cloudData){
      // First time this restaurant has been opened — seed the cloud row.
      // Uses local cache if present, otherwise the built-in default data.
      const localFallback = load();
      cloudData = localFallback;
      await ensureCloudRowExists(cloudData);
    }
    state = migrateState(cloudData, defaultState());
  }catch(e){
    console.error(e);
    // Fall back to local cache so the app still works if the network fails.
    state = load();
  }
  showAppShell();
  renderAll();
}

async function bootApp(user){
  currentUser = user;
  document.getElementById('loginLoading').style.display = 'block';
  document.getElementById('loginForm').style.display = 'none';

  try{
    isOrganizer = await fetchIsOrganizer(user.id);
  }catch(e){
    console.error(e);
    isOrganizer = false;
  }

  if(isOrganizer){
    try{
      myRestaurants = await fetchAllRestaurants();
    }catch(e){
      console.error(e);
      myRestaurants = [];
    }
    viewMode = 'orgHome';
    showAppShell();
    renderAll();
    return;
  }

  let memberships = [];
  try{
    memberships = await fetchMyRestaurantMemberships(user.id);
  }catch(e){
    console.error(e);
  }

  if(memberships.length === 0){
    viewMode = 'noAccess';
    showAppShell();
    renderAll();
    return;
  }

  // An owner is expected to have exactly one restaurant. If they somehow
  // have more than one, open the first — they can be re-linked by the
  // Organizer if that's ever wrong.
  await openRestaurant(memberships[0].id, memberships[0].name);
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginSubmitBtn');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Sign in';
  if(error){
    errEl.textContent = error.message || 'Sign in failed. Check your email and password.';
    errEl.style.display = 'block';
    return;
  }
  bootApp(data.user);
});

document.getElementById('btnSignOut').addEventListener('click', async ()=>{
  await supabaseClient.auth.signOut();
  currentUser = null;
  currentRestaurantId = null;
  currentRestaurantName = '';
  isOrganizer = false;
  myRestaurants = [];
  viewMode = 'loading';
  document.getElementById('loginForm').style.display = '';
  document.getElementById('loginLoading').style.display = 'none';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  showLoginScreen();
});

(async function initAuth(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session && session.user){
    showLoginScreen(); // keep visible with the loading message while we fetch data
    bootApp(session.user);
  } else {
    showLoginScreen();
  }
})();
</script>
